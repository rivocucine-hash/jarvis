name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Μοντέλο αναγνώρισης «Τζάρβις» (offline)
        run: |
          mkdir -p android/app/src/main/assets
          curl -sSL -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/model.zip -d /tmp/model
          mv /tmp/model/vosk-model-small-en-us-0.15 android/app/src/main/assets/model-en-us
          uuidgen > android/app/src/main/assets/model-en-us/uuid

      - name: Κλειδί υπογραφής (αν υπάρχει)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/jarvis.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/jarvis.p12" >> "$GITHUB_ENV"
          else
            echo "Χωρίς μόνιμο κλειδί: χρήση προσωρινού (debug)."
          fi

      - name: Χτίσιμο APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/release/app-release.apk jarvis.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: JARVIS Android ${{ github.run_number }}
          files: jarvis.apk
          make_latest: true
          body: |
            Εφαρμογή JARVIS για Android, με αφύπνιση «Τζάρβις» χωρίς ίντερνετ.
            Κατεβάστε το jarvis.apk στο κινητό και ανοίξτε το για εγκατάσταση.
